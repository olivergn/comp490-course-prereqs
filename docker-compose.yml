services:
  neo4j:
    image: neo4j:5.12
    container_name: neo4j_test_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      DB_PASSWORD: |-
        [PASSWORD]
      NEO4J_AUTH: |-
        neo4j/[PASSWORD]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $$DB_PASSWORD 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  test-runner:
    build: .
    container_name: pytest_runner
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687